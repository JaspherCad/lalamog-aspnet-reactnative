name: lalamog
x-api: &api
  image: lalamog-api:local
  environment: &api-environment
    ASPNETCORE_ENVIRONMENT: Development
    ConnectionStrings__Default: Server=sqlserver;Database=Lalamog;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Run scripts/setup.ps1 first};Encrypt=True;TrustServerCertificate=True
    Storage__Path: /data/uploads
    DataProtection__Path: /data/keys
    Cookies__Secure: "false"
  volumes:
    - uploads:/data/uploads
    - cookie-keys:/data/keys

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Run scripts/setup.ps1 first}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  initialize:
    <<: *api
    command: ["--initialize"]
    environment:
      <<: *api-environment
      Seed__Demo: ${SEED_DEMO:-true}
      Seed__Password: ${DEMO_PASSWORD:?Run scripts/setup.ps1 first}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    build:
      context: .
      dockerfile: src/Lalamog.Api/Dockerfile
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq@sha256:0452ee3fd3b9a74160b251e693338616b464f22df4d4ba43304c101bebdca292
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lalamog}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/setup.ps1 first}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  sql-data:
  uploads:
  cookie-keys:
  redis-data:
  rabbitmq-data:
